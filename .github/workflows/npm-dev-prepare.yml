name: Prepare npm dev candidate (no publication)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      [
        apps/**,
        packages/**,
        scripts/**,
        tests/**,
        package.json,
        pnpm-lock.yaml,
        .github/workflows/npm-dev-prepare.yml,
      ]
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'bYiyLi/Avru' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      sha256: ${{ steps.record.outputs.sha256 }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global --ignore-scripts pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild
      - run: pnpm --filter @avru/extension exec wxt prepare
      - run: pnpm prepare:frpc
      - run: pnpm package:cli
      - run: node scripts/release/npm-candidate.mjs --scope
      - run: mkdir -p artifacts/npm-distribution
      - run: npm pack ./artifacts/npm-dev --ignore-scripts --pack-destination artifacts/npm-distribution
      - id: record
        run: node scripts/release/record-candidate.mjs
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: npm-dev-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/npm-distribution/
          if-no-files-found: error
          retention-days: 14
  validate:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global --ignore-scripts pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild
      - run: pnpm --filter @avru/extension exec wxt prepare
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: artifacts/npm-distribution
      - run: node scripts/release/verify-npm-candidate.mjs
        env:
          AVRU_EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          AVRU_EXPECTED_SOURCE: ${{ github.sha }}
          AVRU_EXPECTED_RUN: ${{ github.run_id }}
      - run: cp -R artifacts/avru/payload/frpc artifacts/frpc
      - run: pnpm check
      - run: pnpm test:runner
      - run: pnpm test:gates
      - run: pnpm check:audit
      - run: pnpm test:release
      - run: pnpm package:prod
      - run: pnpm test:installer
      - run: pnpm --filter @avru/extension build
        env:
          AVRU_BUILD_CHANNEL: prod
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
        env:
          AVRU_E2E_PACKAGE_ROOT: artifacts/avru
      - run: npm publish ./artifacts/npm-distribution/avru-setup-0.1.0-dev.1.tgz --dry-run --ignore-scripts --tag dev --access public --registry https://registry.npmjs.org/ --provenance=false
