name: Publish approved scoped npm dev candidate
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Approved successful npm-dev-prepare run ID
        type: string
        required: true
      candidate_artifact:
        description: Approved canonical artifact ID from that run
        type: string
        required: true
      candidate_sha256:
        description: Approved SHA-256 of avru-setup-0.1.0-dev.1.tgz
        type: string
        required: true
      confirm_public_release:
        description: Publish this exact approved candidate immediately to public dev
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: avru-first-npm-dev-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'bYiyLi/Avru' && github.ref == 'refs/heads/main' && inputs.confirm_public_release
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      AVRU_CANDIDATE_RUN: ${{ inputs.candidate_run }}
      AVRU_CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact }}
      AVRU_EXPECTED_SHA256: ${{ inputs.candidate_sha256 }}
      AVRU_EXPECTED_RUN: ${{ inputs.candidate_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global --ignore-scripts npm@11.21.2
      - id: source
        run: node scripts/release/verify-release-run.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.candidate_artifact }}
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: artifacts/npm-distribution
          merge-multiple: true
      - run: node scripts/release/verify-npm-candidate.mjs
        env:
          AVRU_EXPECTED_SOURCE: ${{ steps.source.outputs.source_sha }}
      - run: npm publish ./artifacts/npm-distribution/avru-setup-0.1.0-dev.1.tgz --dry-run --ignore-scripts --tag dev --access public --provenance=false --registry https://registry.npmjs.org/
      - name: Publish the exact candidate once
        env:
          NODE_AUTH_TOKEN: ${{ secrets.AVRU_NPM_PUBLISH_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/avru-publish.npmrc
        run: |
          set -euo pipefail
          trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          umask 077
          test -n "$NODE_AUTH_TOKEN"
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          test "$(npm whoami --registry https://registry.npmjs.org/)" = 'baiyihuan'
          node --input-type=module <<'NODE'
          const response = await fetch('https://registry.npmjs.org/@avru%2fsetup/0.1.0-dev.1');
          if (response.status !== 404) throw new Error('Version already exists or registry state unknown; inspect before publishing');
          NODE
          npm publish ./artifacts/npm-distribution/avru-setup-0.1.0-dev.1.tgz --tag dev --access public --ignore-scripts --provenance=false --registry https://registry.npmjs.org/
      - name: Verify registry and downloaded package (never republish on failure)
        run: node scripts/release/verify-published.mjs
