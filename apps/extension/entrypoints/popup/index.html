<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Avru</title>
  </head>
  <body style="width: 320px; padding: 16px; font-family: system-ui">
    <main>
      <h1>Avru</h1>
      <p id="status" role="status"></p>
      <p id="description"></p>
      <form>
        <label for="endpoint" id="endpoint-label"></label>
        <input
          id="endpoint"
          name="endpoint"
          type="url"
          readonly
          required
        /><br />
        <label for="name" id="name-label"></label>
        <input id="name" name="name" maxlength="80" required /><br />
        <p id="pairing-help"></p>
        <button id="pair" type="submit"></button>
      </form>
      <button id="disconnect" type="button"></button>
      <p id="revoke-help"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
